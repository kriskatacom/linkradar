services:
    mysql:
        image: mysql:8.4
        container_name: link-radar-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: linkradar
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
            - "3306:3306"
        volumes:
            - link_radar_mysql:/var/lib/mysql
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
    link_radar_mysql:
