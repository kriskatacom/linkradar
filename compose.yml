services:
    mysql:
        image: mysql:8.4
        container_name: linkradar-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: linkradar
        ports:
            - "3306:3306"
        volumes:
            - linkradar_mysql_data:/var/lib/mysql

    mailpit:
        image: axllent/mailpit:latest
        container_name: linkradar-mailpit
        restart: unless-stopped
        ports:
            - "1025:1025"
            - "8025:8025"

volumes:
    linkradar_mysql_data:
