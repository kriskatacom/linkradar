# LinkRadar local HTTPS reverse proxy.
# Install:
#   sudo cp deploy/nginx/linkradar.conf /etc/nginx/sites-available/linkradar
#   sudo ln -sf /etc/nginx/sites-available/linkradar /etc/nginx/sites-enabled/linkradar
#   sudo nginx -t && sudo systemctl reload nginx
#
# Desktop: https://website.local  → Vite
#          https://website.local/api/ → API
#          https://api.local → API (debug)
# LAN:     https://<LAN_IP> and https://<LAN_IP>/api/
# The IPv4 server_name regex avoids hardcoding a developer machine IP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name website.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name website.local;

    ssl_certificate /etc/nginx/ssl/linkradar/linkradar.pem;
    ssl_certificate_key /etc/nginx/ssl/linkradar/linkradar-key.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name api.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.local;

    ssl_certificate /etc/nginx/ssl/linkradar/linkradar.pem;
    ssl_certificate_key /etc/nginx/ssl/linkradar/linkradar-key.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ~^(?<lan_ip>\d+\.\d+\.\d+\.\d+)$;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ~^(?<lan_ip>\d+\.\d+\.\d+\.\d+)$;

    ssl_certificate /etc/nginx/ssl/linkradar/linkradar.pem;
    ssl_certificate_key /etc/nginx/ssl/linkradar/linkradar-key.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
